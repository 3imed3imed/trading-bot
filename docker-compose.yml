version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signalhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

  worker:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: npm run worker

  realtime:
    build: .
    env_file: .env
    depends_on:
      - redis
    command: npx tsx src/realtime/gateway.ts
    ports:
      - "4001:4001"

volumes:
  pgdata:
