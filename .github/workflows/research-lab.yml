name: Microcap AI Research Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: microcap-research-lab
  cancel-in-progress: true

jobs:
  validate-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Safety tests
        run: python -m unittest discover -s tests -v
      - name: Collect point-in-time evidence and run gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python src/lab.py
      - name: Publish versioned evidence snapshot
        run: |
          git config user.name "microcap-research-lab[bot]"
          git config user.email "microcap-research-lab[bot]@users.noreply.github.com"
          git add docs/data/latest.json state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: autonomous point-in-time evidence snapshot"
          git pull --rebase origin main
          git push
      - name: Preserve reproducibility manifest
        uses: actions/upload-artifact@v5
        with:
          name: research-manifest-${{ github.run_id }}
          path: docs/data/latest.json
          retention-days: 90
