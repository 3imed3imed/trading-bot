name: Microcap AI Research Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/research-lab.yml"
  schedule:
    - cron: "17 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: microcap-research-lab
  cancel-in-progress: true

jobs:
  validate-and-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Safety tests
        run: python -m unittest discover -s tests -v
      - name: Collect point-in-time evidence and run gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python src/lab.py
      - name: Execute end-to-end market adapter smoke path
        run: python src/production_run.py --fixture fixtures/alpaca_iex_snapshot.json --output docs/data/production-smoke.json
      - name: Execute live IEX scan when broker data secrets exist
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [ -n "$APCA_API_KEY_ID" ] && [ -n "$APCA_API_SECRET_KEY" ]; then
            python src/production_run.py --output docs/data/live-scan.json
          else
            echo "Live IEX scan blocked: cloud broker data secrets are not configured."
          fi
      - name: Publish versioned evidence snapshot
        run: |
          git config user.name "microcap-research-lab[bot]"
          git config user.email "microcap-research-lab[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/production-smoke.json docs/data/live-scan.json state/ 2>/dev/null || git add docs/data/latest.json docs/data/production-smoke.json state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: autonomous point-in-time evidence snapshot"
          git pull --rebase origin main
          git push
      - name: Preserve reproducibility manifest
        uses: actions/upload-artifact@v5
        with:
          name: research-manifest-${{ github.run_id }}
          path: docs/data/*.json
          retention-days: 90
